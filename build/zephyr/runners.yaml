# Available runners configured by board.cmake.
runners:
- linkserver
- pyocd
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/fyaih/programacao/projetos/zephyrproject/zephyr/boards/nxp/frdm_kl25z
  # Build outputs:
  elf_file: zephyr.elf
  bin_file: zephyr.bin
  # Host tools:
  gdb: /home/fyaih/zephyr-sdk-1.0.1/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py
  openocd: /home/fyaih/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/bin/openocd
  openocd_search:
    - /home/fyaih/zephyr-sdk-1.0.1/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MKL25Z128xxx4:FRDM-KL25Z
  pyocd:
    - --dt-flash=y
    - --target=kl25z
  jlink:
    - --dt-flash=y
    - --device=MKL25Z128xxx4
